# Free Supabase has no restorable automatic backups (§4). Weekly pg_dump,
# gzipped, kept 90 days as a workflow artifact. Stopgap, not a real backup
# strategy — logged in DECISIONS.md.
#
# Requires repo secret SUPABASE_DB_URL: the full Postgres connection string
# from Supabase → Settings → Database (use the session pooler URI on IPv4
# runners).
name: Weekly database backup

on:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      # /usr/bin/pg_dump is Debian's pg_wrapper and it resolves to the
      # distro's 16 even with 17 installed, so every step below calls the
      # versioned binary directly.
      PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
    steps:
      # Ubuntu ships postgresql-client 16, and pg_dump refuses to dump a
      # newer server — Supabase is on 17. The first version of this workflow
      # used the distro package and every run failed with a version mismatch
      # while still reporting success, so PGDG it is, pinned to the major
      # version the server actually runs.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          test -x "$PG_DUMP" || { echo "$PG_DUMP not installed" >&2; exit 1; }
          "$PG_DUMP" --version

      - name: pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pipefail matters more than it looks: without it the exit code of
          # `pg_dump | gzip` is gzip's, so a failed dump uploaded an empty
          # archive and the run went green. A backup that looks like it works
          # is worse than no backup.
          set -euo pipefail

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret not configured; skipping." && exit 0
          fi

          FILE="backup-$(date +%Y%m%d).sql.gz"
          "$PG_DUMP" "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --schema=public \
            | gzip > "$FILE"

          # Prove the archive is a real dump rather than a valid-but-empty
          # gzip. Every dump of this schema contains the profiles table.
          gzip -t "$FILE"
          if ! gzip -dc "$FILE" | grep -q "CREATE TABLE public.profiles"; then
            echo "Dump does not contain the expected schema — failing." >&2
            gzip -dc "$FILE" | head -40 >&2
            exit 1
          fi

          echo "$FILE is $(stat -c%s "$FILE") bytes, $(gzip -dc "$FILE" | wc -l) lines uncompressed."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 90
          # A missing file means the dump failed silently, which is the whole
          # failure mode this workflow exists to avoid.
          if-no-files-found: error
