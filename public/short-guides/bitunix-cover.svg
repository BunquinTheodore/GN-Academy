<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="bitunixCoverTitle">
  <title id="bitunixCoverTitle">Abstract illustration of a mobile exchange app: a phone with a chart on screen, a lock badge, and a verified-account badge</title>
  <defs>
    <linearGradient id="bxScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="oklch(0.31 0.035 258)"/>
      <stop offset="1" stop-color="oklch(0.2 0.03 258)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="oklch(0.18 0.012 250)"/>
  <circle cx="230" cy="170" r="260" fill="oklch(0.897 0.192 122)" opacity="0.08"/>
  <circle cx="970" cy="600" r="300" fill="oklch(0.748 0.135 220)" opacity="0.06"/>

  <!-- phone -->
  <rect x="470" y="140" width="260" height="470" rx="38" fill="oklch(0.26 0.035 258)" stroke="oklch(1 0 0 / 14%)" stroke-width="2"/>
  <rect x="492" y="172" width="216" height="368" rx="16" fill="url(#bxScreen)"/>
  <rect x="560" y="578" width="80" height="6" rx="3" fill="oklch(1 0 0 / 30%)"/>

  <!-- on-screen candlesticks -->
  <g stroke-linecap="round">
    <line x1="524" y1="330" x2="524" y2="420" stroke="oklch(0.897 0.192 122)" stroke-width="5"/>
    <rect x="514" y="360" width="20" height="46" rx="4" fill="oklch(0.897 0.192 122)"/>
    <line x1="558" y1="300" x2="558" y2="380" stroke="oklch(0.72 0.02 252)" stroke-width="5"/>
    <rect x="548" y="316" width="20" height="38" rx="4" fill="oklch(0.72 0.02 252)"/>
    <line x1="592" y1="260" x2="592" y2="360" stroke="oklch(0.897 0.192 122)" stroke-width="5"/>
    <rect x="582" y="288" width="20" height="50" rx="4" fill="oklch(0.897 0.192 122)"/>
    <line x1="626" y1="230" x2="626" y2="320" stroke="oklch(0.897 0.192 122)" stroke-width="5"/>
    <rect x="616" y="250" width="20" height="42" rx="4" fill="oklch(0.897 0.192 122)"/>
    <line x1="660" y1="270" x2="660" y2="340" stroke="oklch(0.72 0.02 252)" stroke-width="5"/>
    <rect x="650" y="286" width="20" height="34" rx="4" fill="oklch(0.72 0.02 252)"/>
  </g>

  <!-- verified-account badge, top left -->
  <g transform="translate(360,190) rotate(-8)">
    <circle r="72" fill="oklch(0.26 0.035 258)" stroke="oklch(0.86 0.19 122)" stroke-width="3"/>
    <path d="M0 -38 L34 -26 V6 C34 30 18 46 0 56 C-18 46 -34 30 -34 6 V-26 Z"
          fill="none" stroke="oklch(0.897 0.192 122)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-16 4 L-2 20 L20 -14" fill="none" stroke="oklch(0.897 0.192 122)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lock / security badge, bottom right -->
  <g transform="translate(800,540) rotate(7)">
    <circle r="78" fill="oklch(0.26 0.035 258)" stroke="oklch(0.86 0.19 122)" stroke-width="3"/>
    <path d="M-22 -8 v-16 a22 22 0 0 1 44 0 v16" fill="none" stroke="oklch(0.897 0.192 122)" stroke-width="7" stroke-linecap="round"/>
    <rect x="-34" y="-8" width="68" height="52" rx="10" fill="oklch(0.897 0.192 122)"/>
    <circle cy="12" r="6" fill="oklch(0.18 0.012 250)"/>
    <line x1="0" y1="19" x2="0" y2="30" stroke="oklch(0.18 0.012 250)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
