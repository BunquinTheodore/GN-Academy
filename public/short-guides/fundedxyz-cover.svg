<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="fundedxyzCoverTitle">
  <title id="fundedxyzCoverTitle">Abstract illustration of a crypto trading dashboard: a rising chart line, candlesticks, and a funded-account badge</title>
  <defs>
    <path id="fxTrendPath" d="M230,560 C380,540 440,440 560,400 C690,357 780,300 900,220 C960,182 1000,168 1030,158"/>
  </defs>

  <rect width="1200" height="750" fill="oklch(0.18 0.012 250)"/>
  <circle cx="980" cy="180" r="280" fill="oklch(0.897 0.192 122)" opacity="0.08"/>
  <circle cx="220" cy="600" r="260" fill="oklch(0.748 0.135 220)" opacity="0.06"/>

  <!-- baseline candlesticks -->
  <g stroke-linecap="round">
    <line x1="290" y1="500" x2="290" y2="600" stroke="oklch(0.72 0.02 252)" stroke-width="7"/>
    <rect x="274" y="530" width="32" height="52" rx="5" fill="oklch(0.72 0.02 252)"/>
    <line x1="400" y1="470" x2="400" y2="590" stroke="oklch(0.897 0.192 122)" stroke-width="7"/>
    <rect x="384" y="500" width="32" height="60" rx="5" fill="oklch(0.897 0.192 122)"/>
    <line x1="510" y1="410" x2="510" y2="530" stroke="oklch(0.897 0.192 122)" stroke-width="7"/>
    <rect x="494" y="440" width="32" height="56" rx="5" fill="oklch(0.897 0.192 122)"/>
    <line x1="620" y1="370" x2="620" y2="480" stroke="oklch(0.72 0.02 252)" stroke-width="7"/>
    <rect x="604" y="392" width="32" height="50" rx="5" fill="oklch(0.72 0.02 252)"/>
    <line x1="730" y1="300" x2="730" y2="420" stroke="oklch(0.897 0.192 122)" stroke-width="7"/>
    <rect x="714" y="326" width="32" height="56" rx="5" fill="oklch(0.897 0.192 122)"/>
    <line x1="840" y1="250" x2="840" y2="360" stroke="oklch(0.897 0.192 122)" stroke-width="7"/>
    <rect x="824" y="270" width="32" height="52" rx="5" fill="oklch(0.897 0.192 122)"/>
  </g>

  <!-- rising trend line, drawn under the badge and candles -->
  <use href="#fxTrendPath" fill="none" stroke="oklch(0.86 0.19 122)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- funded-account badge, top left -->
  <g transform="translate(340,190) rotate(-6)">
    <circle r="80" fill="oklch(0.26 0.035 258)" stroke="oklch(0.86 0.19 122)" stroke-width="3"/>
    <path d="M0 -42 L38 -29 V8 C38 34 20 50 0 60 C-20 50 -38 34 -38 8 V-29 Z"
          fill="none" stroke="oklch(0.897 0.192 122)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-18 4 L-2 22 L22 -16" fill="none" stroke="oklch(0.897 0.192 122)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- traveling highlight riding the trend line: the one deliberate motion moment for this feature -->
  <circle r="16" fill="oklch(0.897 0.192 122)" opacity="0.35">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#fxTrendPath"/>
    </animateMotion>
    <animate attributeName="r" values="14;20;14" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="9" fill="oklch(0.897 0.192 122)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#fxTrendPath"/>
    </animateMotion>
  </circle>
</svg>
